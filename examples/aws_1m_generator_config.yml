# AWS generator configuration targeting approximately 500,000 hourly rows
# for the 2026-09-01 through 2026-10-13 date range.
#
# The generator counts total 520. Most AWS generators emit approximately one
# row per hour, so this produces roughly 520 * 1,008 = 524,000 rows before
# provider-specific expansion.

payer_account: 9999999999999
max_account_id_length: 13
max_users: 100
max_name_words: 2
max_resource_id_length: 10

max_data_transfer_gens: 130
max_ebs_gens: 130
max_ec2_gens: 260
max_rds_gens: 130
max_route53_gens: 130
max_s3_gens: 130
max_vpc_gens: 130

# The report command may override the bucket with --aws-s3-bucket-name.
upload:
  aws:
    bucket: /path/to/project-koku/koku/testing/local_providers/aws_local
    report_name: cost8374-1m-local-aws
    report_prefix: cost8374-1m
