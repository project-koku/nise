---
# Small smoke-test static report. Use this to verify the local upload path
# before generating the large static report from aws_large_local_generator_config.yml.
# Replace the bucket path with the host path to Koku's local AWS bucket.

generators:
  - EC2Generator:
      start_date: 2026-09-01
      end_date: 2026-09-30
      processor_arch: 32-bit
      resource_id: 55555555
      product_sku: VEAJHRNKTJZQ
      region: us-east-1a
      tags:
        resourceTags/user:environment: dev
        resourceTags/user:version: alpha
      instance_type:
        inst_type: m5.large
        physical_cores: 1
        vcpu: 2
        memory: '8 GiB'
        storage: 'EBS Only'
        family: 'General Purpose'
        cost: 1.000
        rate: 0.500

accounts:
  payer: 9999999999999
  user:
    - 9999999999999
  currency_code: USD

upload:
  aws:
    bucket: /path/to/project-koku/koku/testing/local_providers/aws_local
    report_name: cost8374-local-smoke-aws
    report_prefix: cost8374-smoke
