# Generator configuration for a large local AWS report.
#
# Generate the static report with:
#   nise yaml aws examples/aws_large_local_generator_config.yml \
#     -s 2026-09-01 -e 2026-09-30 -o /tmp/aws-large-static.yml
#
# Replace this bucket path or override it with --aws-s3-bucket-name when
# running nise report. For local Koku, use the host path:
# project-koku/koku/testing/local_providers/aws_local

payer_account: 9999999999999
max_account_id_length: 13
max_users: 100
max_name_words: 2
max_resource_id_length: 10

# These values produce a multi-million-row report over a month while keeping
# the generated static YAML practical to inspect and regenerate.
max_data_transfer_gens: 250
max_ebs_gens: 250
max_ec2_gens: 500
max_rds_gens: 250
max_route53_gens: 250
max_s3_gens: 250
max_vpc_gens: 250

upload:
  aws:
    bucket: /path/to/project-koku/koku/testing/local_providers/aws_local
    report_name: cost8374-large-local-aws
    report_prefix: cost8374-large
